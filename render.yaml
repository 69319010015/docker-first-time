services:
  - type: web
    name: simple-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/students
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: simple-backend-db
          property: connectionString
      - key: DB_SSL
        value: "true"

databases:
  - name: simple-backend-db
    plan: free
